apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: default
  source:
    chart: alloy
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: 1.14.1  
    helm:
      values: |
        controller:
          type: daemonset 

        alloy:
          configMap:
            content: |
              // Discover pods in the cluster
              discovery.kubernetes "pods" {
                role = "pod"
              }

              // Relabel and extract labels to appear correctly in Loki
              discovery.relabel "pod_logs" {
                targets = discovery.kubernetes.pods.targets

                rule {
                  source_labels = ["__meta_kubernetes_namespace"]
                  action = "replace"
                  target_label = "namespace"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_name"]
                  action = "replace"
                  target_label = "pod"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_container_name"]
                  action = "replace"
                  target_label = "container"
                }

                rule {
                  source_labels = ["__meta_kubernetes_pod_label_app"]
                  action = "replace"
                  target_label = "app"
                }

                rule {
                  source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
                  action = "replace"
                  separator = "/"
                  target_label = "service_name"
                }
              }

              // Collect logs from Kubernetes
              loki.source.kubernetes "pod_logs" {
                targets    = discovery.relabel.pod_logs.output
                forward_to = [loki.write.endpoint.receiver]
              }

              // Forward logs to the internal Loki service
              loki.write "endpoint" {
                endpoint {
                  url = "http://loki.monitoring-samer.svc.cluster.local:3100/loki/api/v1/push"
                }
              }

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring-samer
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true