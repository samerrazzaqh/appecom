apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: samer-grafana-tls
  namespace: workshop-samer
spec:
  dnsNames:
    - samer-grafana.infra-x.cloud
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: praxis-form-letsencrypt-prod
  secretName: samer-grafana-tls
  usages:
  - digital signature
  - key encipherment