apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: workshop-samer
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend 
          image: ghcr.io/samerrazzaqh/appecom/client:bde7f9da968735f05bdab54c428dc0722e8d3deb
          imagePullPolicy: Always
          env:
            - name: ApiSettings__BaseApiAddress 
              value: "https://samer-kubernetes.infra-x.cloud/"
          ports:
            - containerPort: 80