apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: samer-form-ingress
  namespace: workshop-samer
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - samer-kubernetes.infra-x.cloud
      secretName: samer-form-tls
  rules:
    - host: samer-kubernetes.infra-x.cloud
      http:
        paths:
          # ================= التطبيق الأول (App 1) =================
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /Images
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80
          - path: /images
            pathType: Prefix
            backend:
              service:
                name: backend-service
                port:
                  number: 80

          # ================= التطبيق الثاني (App 2) =================
          - path: /app2
            pathType: Prefix
            backend:
              service:
                name: app2-frontend-service
                port:
                  number: 80
          - path: /app2/api
            pathType: Prefix
            backend:
              service:
                name: app2-backend-service
                port:
                  number: 80
          - path: /app2/actuator
            pathType: Prefix
            backend:
              service:
                name: app2-backend-service
                port:
                  number: 80