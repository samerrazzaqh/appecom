name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Backend API
      - name: Build and Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./AppProject.API/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ github.sha }}

      # Frontend Client
      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./AppProject.Client/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/client:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/client:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]
    env:
      NAMESPACE: workshop-samer
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase repo name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_ECOM }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Deploy with Helm
        working-directory: ./chart-ocean
        run: |
          helm upgrade --install ecom-release . --create-namespace -n "${NAMESPACE}" \
            --set image.backend.image.repository=ghcr.io/${{ env.REPO_LC }}/api \
            --set image.frontend.image.repository=ghcr.io/${{ env.REPO_LC }}/client